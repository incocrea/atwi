<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF7F2">
<link rel="icon" href="../assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<title>ATWI</title>
<meta name="description" content="¡Resuélvelo Jugando! Modo ControversIA y modo NegocIAción.">

<link rel="stylesheet" href="../assets/css/fuentes.css?v=b35b5cc">
<link rel="stylesheet" href="../assets/css/tokens.css?v=b35b5cc">
<link rel="stylesheet" href="../assets/css/base.css?v=b35b5cc">
<link rel="stylesheet" href="../assets/css/app.css?v=b35b5cc">
<link rel="stylesheet" href="../assets/css/modal.css?v=b35b5cc">
</head>

<body class="app">

<div class="marco">

  <header class="cabecera">
    <div>
      <div class="cabecera__titulo"><img src="../assets/img/logotipo-48.png" alt="ATWI" width="123" height="41"></div>
      <div class="cabecera__sub">¡Resuélvelo <b>Jugando!</b></div>
    </div>
    <div class="monedero">
      <!-- EL PROBADOR DE RESULTADOS, y solo para quien puede verlo (titular,
           2026-09-17). Estaba abajo del todo de la portada, con su propio
           título «Solo para vos» y un botón de ancho completo, o sea dos
           piezas de interfaz para una puerta de servicio —y encima gastando el
           alto que ahora se reparten las cartas—. Aquí es un disco más de la
           cabecera, con el signo de AVISO: es lo único de esta app que no es
           para quien juega, y el rojo lo dice sin escribirlo.
           Nace oculto y lo enciende `puedeProbar()`: en el HTML no hay forma
           de saber quién entró. -->
      <button class="ayuda-cabecera ayuda-cabecera--probar" data-accion="probador"
              hidden aria-label="Probador de resultados" title="Probador de resultados">
        <span data-icono="aviso" data-tam="26"></span>
      </button>

      <!-- EL AVISO DE IA VIVE AQUÍ (titular, 2026-09-17), y es el PRIMERO. Bajo
           las cartas era un signo suelto en mitad de la portada; arriba está
           con los otros dos indicadores, con el mismo disco, y el globo sale
           igual: se cuelga de este botón y baja. Se queda en el HTML y no en
           `pintarJugar` porque la cabecera es fija y no se repinta con la
           vista. -->
      <button class="ayuda-cabecera" data-globo="descargo" aria-expanded="false"
              aria-label="Qué hace la IA en ATWI" title="Qué hace la IA en ATWI">
        <span data-icono="ayuda-morado" data-tam="26"></span>
      </button>

      <!-- VIDAS, NO ENERGÍA (titular, 2026-09-17). Era una pastilla con el rayo
           y un contador de «puntos de razón» que nadie actualizaba nunca. Ahora
           es un corazón con el número de vidas, y se presenta COMO EL BUZÓN
           —mismo disco, mismo tipo de insignia— porque son la misma clase de
           cosa: un indicador de la cabecera con una cuenta encima. Qué gasta y
           qué repone una vida se define más adelante; esto es la pieza. -->
      <span class="vidas" title="Vidas">
        <span data-icono="corazon" data-tam="24"></span>
        <span class="vidas__cuenta" id="dato-vidas">3</span>
      </span>
      <button class="buzon-boton" data-accion="buzon" aria-label="Buzón">
        <span data-icono="buzon" data-tam="28"></span>
        <span class="buzon-punto" id="buzon-punto" hidden></span>
      </button>
      <!-- Atajo al perfil. Se esconde en la propia vista de Perfil, donde no
           tendría a dónde llevar. -->
      <button class="avatar avatar--cabecera" id="ficha-cabecera" data-vista="perfil"
              aria-label="Tu perfil" hidden></button>
    </div>
  </header>

  <main class="vistas">
    <section class="vista" id="v-jugar" aria-label="Jugar"></section>
    <section class="vista" id="v-catalogo" aria-label="Catálogo"></section>
    <section class="vista" id="v-historial" aria-label="Historial"></section>
    <section class="vista" id="v-perfil" aria-label="Perfil"></section>
  </main>

  <nav class="barra" aria-label="Navegación principal">
    <!-- LAS BURBUJAS DE LA BARRA (propuesta del titular, 2026-09-16).
         VAN INLINE Y NO COMO IMAGEN DE FONDO, y ese es el motivo de que estén
         aquí y no en `assets/img/`: este dibujo tiene que TOMAR EL COLOR DE LA
         PANTALLA. La barra cambia de tinte con el contexto --lavanda en la
         portada, coral en Juicio, menta en Pacto, azul en QuienGane-- y un PNG
         o un SVG cargado con `url()` traeria su color quemado y desentonaria
         en tres de cada cuatro pantallas. Inline hereda `currentColor`, asi
         que las burbujas son siempre el mismo color de la barra un punto mas
         saturado, sea cual sea.
         Es transparente entera: lo que se ve detras es el fondo de la barra,
         que ya esta puesto. Y `preserveAspectRatio="none"` porque esto no es
         un dibujo que deba conservar su forma, es una textura que se estira a
         lo que mida la pantalla. -->
    <svg class="barra__burbujas" viewBox="0 0 430 74" preserveAspectRatio="none" aria-hidden="true">
      <g fill="currentColor">
        <!-- Las grandes van medio salidas por el borde de abajo: lo que se ve
             es un casquete, que es lo que las hace parecer burbujas subiendo. -->
        <circle cx="26" cy="70" r="17" opacity=".16"/>
        <circle cx="150" cy="76" r="22" opacity=".12"/>
        <circle cx="290" cy="73" r="19" opacity=".14"/>
        <circle cx="404" cy="78" r="24" opacity=".11"/>
        <!-- Las medianas, repartidas sin ritmo: a intervalos iguales se leerian
             como una cenefa y no como algo flotando. -->
        <circle cx="72" cy="30" r="7" opacity=".14"/>
        <circle cx="198" cy="19" r="5.5" opacity=".16"/>
        <circle cx="246" cy="46" r="8" opacity=".10"/>
        <circle cx="344" cy="26" r="6.5" opacity=".15"/>
        <!-- Y las chicas, que son las que dan la sensacion de movimiento. -->
        <circle cx="104" cy="14" r="3.2" opacity=".18"/>
        <circle cx="176" cy="52" r="2.6" opacity=".16"/>
        <circle cx="312" cy="12" r="3" opacity=".17"/>
        <circle cx="376" cy="48" r="2.4" opacity=".15"/>
        <circle cx="52" cy="50" r="2.8" opacity=".14"/>
        <circle cx="226" cy="8" r="2.2" opacity=".16"/>
      </g>
    </svg>
    <button class="barra-item" data-vista="jugar" data-etiqueta="Jugar"></button>
    <button class="barra-item" data-vista="catalogo" data-etiqueta="Catálogo"></button>
    <button class="barra-item" data-vista="historial" data-etiqueta="Historial"></button>
    <button class="barra-item" data-vista="perfil" data-etiqueta="Perfil"></button>
  </nav>

  <!-- La puerta: registro y entrada. Solo nombre y correo. -->
  <div class="modal" id="puerta" hidden role="dialog" aria-modal="true" aria-labelledby="t-puerta">
    <div class="modal__cabecera">
      <h2 class="solo-lectores" id="t-puerta">Entrar a ATWI</h2>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie">
      <button class="boton boton--bloque boton--grande" data-accion="continuar">Mandarme el código</button>
    </div>
  </div>

  <!-- ================= Modales a pantalla completa ================= -->

  <!-- El buzón: invitaciones, turnos, resultados y avisos del juego -->
  <div class="modal" id="m-buzon" hidden role="dialog" aria-modal="true" aria-labelledby="t-buzon">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-buzon" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-buzon">Buzón</span>
    </div>
    <div class="modal__cuerpo"></div>
  </div>

  <!-- La sala: aquí se juega -->
  <div class="modal" id="m-partida" hidden role="dialog" aria-modal="true" aria-labelledby="t-partida">
    <div class="modal__cabecera">
      <button class="boton-icono" data-accion="p-salir" aria-label="Salir de la partida" data-icono="atras"></button>
      <span class="modal__titulo" id="t-partida">La sala</span>
      <!-- En qué turno va la partida. Vive en la cabecera y no en la tarjeta:
           es un dato de estado, se consulta de refilón y no tiene por qué
           robarle sitio a lo que hay que leer para hablar. -->
      <span class="modal__estado" id="p-turno" hidden></span>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie"></div>
  </div>

  <!-- Detalle de un tema -->
  <div class="modal" id="m-tema" hidden role="dialog" aria-modal="true" aria-labelledby="t-tema">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-tema" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-tema"></span>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie">
      <button class="boton boton--bloque boton--grande" data-accion="jugar-aqui">Jugar los dos en este móvil</button>
      <!-- Los dos del mismo tamaño. Son las DOS MANERAS DE JUGAR, no una opción
           y su alternativa menor: jugar aquí y jugar invitando valen lo mismo, y
           uno más bajo que el otro dice lo contrario.
           Y EL QUE QUEDA EN BLANCO VA PUNTEADO: regla del titular para todos los
           pares de botones del juego. Sin el punteado, el blanco se lee como un
           botón apagado; con él se lee como la otra puerta. -->
      <button class="boton boton--suave boton--bloque boton--grande boton--punteado" data-accion="proponer">Enviar invitación</button>
    </div>
  </div>

  <!-- Tu ficha: el nombre con el que te ven y el dibujo que te representa -->
  <div class="modal" id="m-perfil" hidden role="dialog" aria-modal="true" aria-labelledby="t-perfil">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-perfil" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-perfil">Tu ficha</span>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie">
      <button class="boton boton--bloque boton--grande" data-accion="guardar-ficha">Guardar</button>
    </div>
  </div>

  <!-- Escribir un tema: uno propio, o reescribir uno del catálogo -->
  <div class="modal" id="m-escribir" hidden role="dialog" aria-modal="true" aria-labelledby="t-escribir">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-escribir" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-escribir">Escribir un tema</span>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie">
      <!-- El texto lo pone `abrirEscribir()`: en QuiénGane lo que se guarda es un
           premio, no un tema. Aqui queda el de respaldo, que es el caso comun. -->
      <button class="boton boton--bloque boton--grande" data-accion="guardar-tema"
              id="e-guardar">Guardar el tema</button>
    </div>
  </div>

  <!-- Explicación de un modo. Se abre desde su carta y lleva su color. -->
  <div class="modal" id="m-explicar" hidden role="dialog" aria-modal="true" aria-labelledby="t-explicar">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-explicar" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-explicar">Cómo se juega</span>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie">
      <button class="boton boton--bloque boton--grande" data-accion="jugar-explicado">Jugar</button>
    </div>
  </div>

  <!-- Retocar UNA sección del tema, sin abrir el editor entero -->
  <div class="modal" id="m-retocar" hidden role="dialog" aria-modal="true" aria-labelledby="t-retocar">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-retocar" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-retocar">Retocar</span>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie">
      <button class="boton boton--bloque boton--grande" data-accion="guardar-retoque">Guardar</button>
    </div>
  </div>

  <!-- Elegir abogado. Va en su propio modal y no desplegado en la pantalla de
       preparar: la mayoría va a jugar sin abogado, y seis botones a la vista
       para una decisión que casi nadie toca es llenar la pantalla por nada. -->
  <div class="modal" id="m-abogados" hidden role="dialog" aria-modal="true" aria-labelledby="t-abogados">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-abogados" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-abogados">Elegí tu abogado</span>
    </div>
    <div class="modal__cuerpo"></div>
  </div>

  <!-- Elegir juez: los seis, sin veto. El juez es uno para toda la partida. -->
  <div class="modal" id="m-jueces" hidden role="dialog" aria-modal="true" aria-labelledby="t-jueces">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-jueces" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-jueces">¿Quién juzga?</span>
    </div>
    <div class="modal__cuerpo"></div>
  </div>

  <!-- EL PROBADOR DE RESULTADOS. No es para jugadores: solo se ve con la cuenta
       del titular o en modo de pruebas (localhost con ?local=1). Arma la escena
       del veredicto a mano —modo, final, juez, las dos fichas— para poder mirar
       la pantalla sin jugar una partida ni gastar un veredicto de verdad. -->
  <div class="modal" id="m-probador" hidden role="dialog" aria-modal="true" aria-labelledby="t-probador">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-probador" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-probador">Probador de resultados</span>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie">
      <!-- LOS DOS SON «REPRODUCIR», y lo que cambia es DESDE DÓNDE. «Fin de
           ronda» arranca en el instante en que se manda la última intervención y
           recorre todo lo que viene después --la espera, lo que conteste el
           modelo, y en Negociación elegir y firmar--; «victoria» salta directo a
           la escena del resultado. Los nombres viejos --«la escena» y «ensayar»--
           no decían eso: uno no decía qué escena y el otro sonaba a otra cosa
           distinta en vez de a la misma vista desde más atrás. -->
      <!-- Y DESDE 2026-09-16 SON TRES, EN ORDEN DE PARTIDA: la entrada, el fin
           de ronda y la victoria. «La entrada» es el sorteo de quien abre y la
           cortinilla del encuentro --seis segundos que hasta ahora costaban
           montar una partida entera para poder mirarlos: elegir tema, invitado,
           turnos y fichas--. Va primero porque es lo primero que pasa.
           Los tres del mismo tamano, como en el acta: son tres maneras de mirar
           lo mismo y ninguna es la opcion menor. Lo que las distingue es el
           color, y el lleno es el ultimo porque es el final. -->
      <button class="boton boton--suave boton--bloque boton--grande boton--punteado"
              data-accion="pb-entrada">Reproducir la entrada</button>
      <button class="boton boton--suave boton--bloque boton--grande boton--punteado"
              data-accion="pb-votar" id="pb-votar">Reproducir fin de ronda</button>
      <button class="boton boton--bloque boton--grande" data-accion="pb-jugar">Reproducir victoria</button>
    </div>
  </div>

  <!-- Borrar una partida del historial: qué se lleva y qué no -->
  <div class="modal" id="m-olvidar" hidden role="dialog" aria-modal="true" aria-labelledby="t-olvidar">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-olvidar" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-olvidar">Borrar esta partida</span>
    </div>
    <div class="modal__cuerpo"></div>
    <!-- LOS BOTONES ABAJO Y DEL MISMO TAMAÑO (corrección del titular,
         2026-09-15). Vivían dentro del cuerpo, pegados al texto, con uno
         `--grande` y el otro no: era el único modal del juego que no seguía el
         patrón. Y no es solo estética: con el pie fijo los dos quedan donde el
         pulgar los busca en todas las pantallas, y el cuerpo puede crecer sin
         empujarlos fuera de la vista. -->
    <div class="modal__pie"></div>
  </div>

  <!-- AQUÍ HUBO UN `m-actas` Y SE FUE (corrección del titular, 2026-09-15). Las
       actas eran una pantalla aparte, a la que se entraba desde una tarjeta del
       historial y de la que había que volver. Ahora son un CHIP más del propio
       historial —«En este móvil · En línea · Lo que acordaron»— y la lista se
       carga en el sitio: se cambia de lo que se está mirando sin moverse. -->

  <!-- Antes de empezar: quién defiende qué, y con quién se juega -->
  <div class="modal" id="m-preparar" hidden role="dialog" aria-modal="true" aria-labelledby="t-preparar">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-preparar" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-preparar">Antes de empezar</span>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie">
      <button class="boton boton--bloque boton--grande" data-accion="sortear" disabled>Sortear quién abre</button>
    </div>
  </div>

  <!-- Invitación -->
  <div class="modal" id="m-invitar" hidden role="dialog" aria-modal="true" aria-labelledby="t-invitar">
    <div class="modal__cabecera">
      <button class="boton-icono" data-cerrar="m-invitar" aria-label="Volver" data-icono="atras"></button>
      <span class="modal__titulo" id="t-invitar">Invitación</span>
    </div>
    <div class="modal__cuerpo"></div>
    <div class="modal__pie">
      <button class="boton boton--bloque" data-cerrar="m-invitar">Hecho</button>
    </div>
  </div>

</div>

<p class="aviso-escritorio">ATWI está diseñado solo para móvil. Esto es una vista previa dentro de un marco de teléfono.</p>

<script src="../assets/js/demo.js?v=b35b5cc"></script>

</body>
