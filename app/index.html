<!-- ABRIR LA CONEXION CON SUPABASE MIENTRAS SE CARGA EL RESTO.

     La primera llamada al servidor paga DNS + TCP + TLS a Oregón, y eso

     sale del camino crítico si el navegador va abriendo la conexión desde

     que lee la cabecera. Medido en frío: la primera consulta tardó 1,4 s

     contra 270 ms cuando la conexión ya estaba abierta.

     `crossorigin` es obligatorio aquí: sin él el navegador abre una

     conexión anónima que las peticiones con credenciales no reutilizan, y

     el preconnect no sirve de nada. -->

<!-- LA POLÍTICA DE CONTENIDO VA EN UN `meta` PORQUE GITHUB PAGES NO DEJA PONER
     CABECERAS (docs/07, fase 5). No arregla ningún fallo de hoy --no hay XSS
     explotable: los 60+ `innerHTML` pasan por `esc()`-- sino que convierte el
     próximo en uno contenido: con esto, un script inyectado no puede cargarse
     desde fuera ni mandar nada a ningún sitio que no sea Supabase.
     ⚠️ `style-src` NECESITA 'unsafe-inline': el juego escribe `style="--voz:…"`
     por todas partes --el color del personaje, el nivel del micrófono-- y sin
     eso la app se ve en blanco y negro.
     ⚠️ Y `base-uri 'none'`: sin ella, un XSS con un solo `<base>` redirige TODOS
     los `<script src>` relativos a su servidor. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: https://vauarfofsfgwnuyjfpni.supabase.co; connect-src 'self' https://vauarfofsfgwnuyjfpni.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="preconnect" href="https://vauarfofsfgwnuyjfpni.supabase.co" crossorigin>
  <!-- Y el respaldo para quien no entienda `preconnect`: al menos que resuelva
       el nombre. Aquí no es un adorno —medido el 2026-09-18 en la máquina del
       titular, el DNS interno no contesta para este dominio y la resolución en
       frío tarda 12 s hasta que responde el secundario. -->
  <link rel="dns-prefetch" href="https://vauarfofsfgwnuyjfpni.supabase.co">

<template id="tpl-terminos" data-version="1" data-fecha="19 de septiembre de 2026">
  <p class="legal__fecha">Versión 1 · 19 de septiembre de 2026</p>

  <p class="legal__corto"><b>Lo corto:</b> ATWI es un juego para discutir mejor.
    No es terapia ni asesoramiento profesional, y su resultado no dice quién tiene
    razón en la vida. Tu voz no se guarda nunca. Si un tema toca violencia o daño,
    la partida se detiene.</p>

  <h3>1. Qué es ATWI</h3>
  <p>Un juego para dos personas: eligen un tema, graban lo que piensan por turnos y
    una inteligencia artificial devuelve un resultado —un veredicto en Controversia,
    un acuerdo propuesto en Pacto— o decide un premio en QuiénGane. Es entretenimiento.</p>

  <h3>2. Qué no es</h3>
  <p>ATWI <b>no reemplaza la terapia ni el asesoramiento profesional</b>, sea
    psicológico, legal, médico o financiero. Lo que diga el juez o proponga el
    mediador es parte del juego: no es un dictamen, no prueba nada y no dice quién
    tiene razón fuera de la partida. Si están pasando por algo serio, búsquen ayuda
    de verdad.</p>

  <h3>3. Quién puede jugar</h3>
  <p>Tienes que tener al menos <b>16 años</b> para abrir una cuenta. Si todavía no
    eres mayor de edad en tu país, necesitas el permiso de quien te cuida para
    usar ATWI. Si sabemos que una cuenta es de alguien menor de 16, la cerramos y
    borramos lo que tenga.</p>

  <h3>4. Tu cuenta</h3>
  <p>Se entra con un correo y se juega con un apodo. No pedimos tu nombre real.
    El apodo es único y lo puedes cambiar. Eres responsable de tu contraseña y de
    lo que se haga desde tu cuenta: si crees que alguien entró, cámbiala.</p>

  <h3>5. Lo que dices y lo que escribes</h3>
  <p>Lo que grabas y los temas que escribes <b>siguen siendo tuyos</b>. Para que el
    juego funcione nos das permiso para transcribirlo, pulirlo, locutarlo con la voz
    de un personaje, enseñárselo a la otra persona de la partida y guardarlo mientras
    la partida exista. Nada de eso se usa para otra cosa, no se vende y no se publica.</p>
  <p><b>Tu voz no se guarda.</b> La grabación se convierte en texto y se descarta en
    la misma llamada; lo que se oye siempre es el personaje. Qué se guarda y quién lo
    procesa está en la hoja de <a href="../#privacidad" target="_blank" rel="noopener">Privacidad
    y datos</a>, que forma parte de estas condiciones.</p>

  <h3>6. Cómo hay que tratarse</h3>
  <p>ATWI existe para discutir mejor, no para hacer daño. No se puede usar para
    amenazar, acosar, humillar ni presionar a nadie; para subir datos de terceros;
    ni para contenido sexual con menores, delitos o cualquier otra cosa ilegal.</p>
  <p>El juego <b>detiene una partida</b> cuando detecta señales de violencia, abuso o
    daño a una persona, y en ese caso no juzga ni propone nada. Eso no es un juicio
    sobre nadie: es que ese tema no se juega aquí. Podemos cerrar una cuenta que use
    ATWI para lo que este punto prohíbe.</p>

  <h3>7. La inteligencia artificial</h3>
  <p>El juez, el mediador, el personaje que habla por ti y el revisor de temas son
    modelos de IA. Lo que dicen se comprueba con reglas antes de enseñarse, pero
    <b>pueden equivocarse</b>: pueden entender mal lo que dijiste, puntuar de una
    manera que te parezca injusta o proponer algo que no encaje. El audio que suena
    es una voz sintética de un personaje, no la de ninguna persona.</p>

  <h3>8. Vidas y pagos</h3>
  <p>Crear una partida cuesta una «vida». Hoy no se cobra por ellas.
    <span class="legal__pendiente">PENDIENTE: condiciones de compra, reembolsos y
    precios cuando se active el cobro.</span></p>

  <h3>9. El servicio está en construcción</h3>
  <p>ATWI se ofrece <b>tal como está</b>. Puede cambiar, fallar, perder datos o dejar
    de funcionar sin aviso. No prometemos que esté siempre disponible ni que los
    resultados sean correctos.</p>

  <h3>10. Responsabilidad</h3>
  <p>Hasta donde la ley lo permita, no respondemos por lo que pase a raíz de usar el
    juego: decisiones que tomen, discusiones que tengan, ni daños indirectos. Lo que
    ocurre entre ustedes es de ustedes.</p>

  <h3>11. Borrar tus datos</h3>
  <p>Cada partida se borra desde el historial, con sus grabaciones del personaje y su
    acta. Para borrar la cuenta entera, escríbenos a
    <a href="mailto:hola@atwi.app">hola@atwi.app</a> y lo hacemos.</p>

  <h3>12. Si estas condiciones cambian</h3>
  <p>Te las volvemos a enseñar y hay que aceptarlas otra vez para seguir jugando.</p>

  <h3>13. Quién está detrás, y cómo escribirnos</h3>
  <p>ATWI lo presta <b>Incocrea SAS</b>. Para cualquier cosa —una duda, un problema, borrar
    tu cuenta o ejercer tus derechos sobre tus datos— escríbenos a
    <a href="mailto:hola@atwi.app">hola@atwi.app</a>.</p>
  <p><span class="legal__pendiente">PENDIENTE: país de constitución de Incocrea SAS y ley
    aplicable a estas condiciones.</span></p>
