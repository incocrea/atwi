<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Marcar las bocas</title>
<!--
  HERRAMIENTA DE UN RATO, no parte del juego. Sirve para leer la caja de la boca
  de cada personaje pinchando encima, en vez de adivinarla mirando una
  cuadricula: se probo asi cuatro veces y las cuatro salieron mal --una caja cayo
  en el pelo y otra en una oreja-- porque en una tira compuesta es facil
  equivocarse de panel.

  Dos clics por personaje: esquina de arriba a la izquierda y de abajo a la
  derecha. Abajo sale la linea lista para copiar al cortador.
-->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px;
         background: #2a2a32; color: #eee; }
  .fila { display: flex; gap: 12px; flex-wrap: wrap; }
  .uno { position: relative; }
  .uno img { display: block; image-rendering: pixelated; cursor: crosshair; }
  .uno b { position: absolute; top: 4px; left: 6px; color: #fff;
           text-shadow: 0 0 4px #000; }
  .caja { position: absolute; border: 2px solid #f33; pointer-events: none; }
  pre { background: #111; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
</style>

<p>Dos clics por cara: arriba-izquierda y abajo-derecha de la boca.</p>
<div class="fila" id="fila"></div>
<pre id="salida">(sin marcar)</pre>

<script>
  var QUIEN = ['kai', 'nico', 'dante', 'luna', 'nina', 'maya'];
  /* La pieza mide 620x960 y se enseña a la mitad; solo se recorta la zona de la
     cara para que quepan las seis a la vez. */
  var ESC = 1.6, X0 = 230, Y0 = 310, AN = 160, AL = 150;
  var marcas = {};

  QUIEN.forEach(function (q) {
    var d = document.createElement('div');
    d.className = 'uno';
    d.style.cssText = 'width:' + AN * ESC + 'px;height:' + AL * ESC +
                      'px;overflow:hidden;position:relative';
    var im = document.createElement('img');
    im.src = 'assets/img/personajes/' + q + '-azul-hablando.webp';
    im.style.cssText = 'width:' + 620 * ESC + 'px;margin-left:' + -X0 * ESC +
                       'px;margin-top:' + -Y0 * ESC + 'px';
    d.appendChild(im);
    var n = document.createElement('b'); n.textContent = q; d.appendChild(n);
    d.addEventListener('click', function (e) {
      var r = d.getBoundingClientRect();
      var x = Math.round((e.clientX - r.left) / ESC + X0);
      var y = Math.round((e.clientY - r.top) / ESC + Y0);
      var m = marcas[q] || (marcas[q] = []);
      if (m.length >= 2) m.length = 0;
      m.push([x, y]);
      pintar();
    });
    document.getElementById('fila').appendChild(d);
  });

  function pintar() {
    document.querySelectorAll('.caja').forEach(function (c) { c.remove(); });
    var l = [];
    QUIEN.forEach(function (q, i) {
      var m = marcas[q];
      if (!m || m.length < 2) return;
      var x0 = Math.min(m[0][0], m[1][0]), y0 = Math.min(m[0][1], m[1][1]);
      var x1 = Math.max(m[0][0], m[1][0]), y1 = Math.max(m[0][1], m[1][1]);
      l.push("    '" + q + "': (" + x0 + ", " + y0 + ", " + x1 + ", " + y1 + "),");
      var c = document.createElement('div');
      c.className = 'caja';
      c.style.cssText = 'left:' + (x0 - X0) * ESC + 'px;top:' + (y0 - Y0) * ESC +
        'px;width:' + (x1 - x0) * ESC + 'px;height:' + (y1 - y0) * ESC + 'px';
      document.querySelectorAll('.uno')[i].appendChild(c);
    });
    document.getElementById('salida').textContent = l.length
      ? 'BOCAS = {\n' + l.join('\n') + '\n}' : '(sin marcar)';
  }
</script>
