<title>ATWI · tablero</title>

<style>
  /* Los nombres de siempre del tablero, pero ahora SALEN DE LOS TOKENS DEL
     JUEGO: un color que cambie en `tokens.css` cambia aquí también. */
  :root {
    --suave: var(--tinta-suave); --tenue: var(--tinta-tenue);
    --fondo: var(--crema); --papel: var(--superficie);
    --marca: var(--lavanda); --bien: var(--negociacion); --mal: var(--peligro); --ojo: var(--sol-oscuro);
    --lado: 232px; --alto-cab: 60px;
  }
  body { font-size: 15px; }
  main p { margin: 0 0 10px; }

  /* --- La cabecera: el logotipo del juego y quién está dentro --- */
  header.cab {
    background: var(--papel); box-shadow: var(--sombra-1); height: var(--alto-cab);
    padding: 0 22px; display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10;
  }
  header.cab img { height: 38px; width: auto; }
  header.cab h1 { font-size: 1.25rem; color: var(--lavanda-oscuro); }
  header.cab .quien { margin-left: auto; color: var(--suave); font-size: 13px; }
  header.cab .salir { font: inherit; font-weight: 800; background: none; border: 0;
    color: var(--lavanda-oscuro); cursor: pointer; }

  /* --- EL MENÚ, AGRUPADO POR TIPO (titular, 2026-09-23) ---
     Diez pestañas en fila eran una lista sin orden, y con la configuración y el
     playground dentro serían quince. En la barra lateral van por grupos. */
  .armazon { display: grid; grid-template-columns: var(--lado) minmax(0, 1fr);
             min-height: calc(100vh - var(--alto-cab)); }
  nav.menu {
    background: var(--papel); border-right: 1px solid var(--linea);
    padding: 16px 12px 24px; position: sticky; top: var(--alto-cab); align-self: start;
    height: calc(100vh - var(--alto-cab)); overflow-y: auto;
  }
  .grupo + .grupo { margin-top: 16px; }
  .grupo__t {
    font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--tenue); padding: 0 12px 4px;
  }
  /* EL TÍTULO PLIEGA SU GRUPO (titular, 2026-09-23). Es un botón y no un
     párrafo, así que le quita a `nav.menu button` lo que es de las pestañas:
     el relleno, el fondo al pasar y el tamaño de letra. La flecha dice hacia
     dónde está: abajo abierto, a la derecha plegado. */
  nav.menu .grupo__t {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    font-size: 12px; padding: 4px 12px; border-radius: var(--radio-chip); color: var(--tenue);
  }
  nav.menu .grupo__t:hover { background: none; color: var(--tinta-suave); }
  nav.menu .grupo__t::after {
    content: ''; width: 7px; height: 7px; flex: none; margin-right: 2px;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s;
  }
  nav.menu .grupo[data-plegado] .grupo__t::after { transform: rotate(-45deg); }
  /* Plegado se esconde todo MENOS la pestaña en la que se está: si no, al
     plegar el grupo de lo que se está mirando no quedaría ni rastro de dónde
     se está. */
  nav.menu .grupo[data-plegado] > button[data-pest]:not([aria-current]) { display: none; }
  nav.menu button {
    display: block; width: 100%; text-align: left;
    font-family: var(--display); font-weight: 700; font-size: 15px;
    background: none; border: 0; cursor: pointer; color: var(--tinta-suave);
    padding: 7px 12px; border-radius: var(--radio-chip);
  }
  nav.menu button:hover { background: var(--crema-hondo); color: var(--tinta); }
  nav.menu button[aria-current] { background: var(--lavanda-tinte); color: var(--lavanda-oscuro); }
  nav.menu .solo-local { font-family: var(--texto); font-size: 10px; font-weight: 800;
    color: var(--tenue); margin-left: 4px; text-transform: uppercase; letter-spacing: .05em; }
  main { padding: 22px 26px 40px; max-width: 1240px; width: 100%; }
  main.lleno { max-width: none; padding: 0; }

  /* --- Las piezas de siempre, con la mano del juego --- */
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .tarjeta { background: var(--papel); border-radius: var(--radio-tarjeta); box-shadow: var(--sombra-1); padding: 14px 18px; }
  .tarjeta .eti { color: var(--tenue); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
  .tarjeta .dato { font-family: var(--display); font-size: 26px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tarjeta .pie { color: var(--suave); font-size: 12px; margin-top: 2px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--papel);
          border-radius: var(--radio-tarjeta); box-shadow: var(--sombra-1); overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  th { background: var(--lavanda-tinte); font-family: var(--display); font-size: 12px;
       letter-spacing: .04em; color: var(--lavanda-oscuro); font-weight: 800; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  h2 { font-size: 1.2rem; margin: 26px 0 10px; color: var(--tinta); }
  h2:first-child { margin-top: 0; }
  .chico { font-size: 12px; color: var(--suave); }
  .mal { color: var(--mal); } .bien { color: var(--negociacion-oscuro); } .ojo { color: var(--ojo); }
  button.peligro { font: inherit; font-size: 12px; font-weight: 800; color: var(--mal);
    background: var(--papel); border: 2px solid var(--mal); border-radius: 999px; padding: 1px 10px;
    cursor: pointer; }
  button.peligro:disabled { opacity: .5; cursor: default; }
  .pastilla { display: inline-block; padding: 1px 8px; border-radius: 99px;
              background: var(--lavanda-tinte); color: var(--lavanda-oscuro); font-size: 11px; font-weight: 800; }
  .aviso { background: var(--sol-tinte); color: #6b5316; box-shadow: var(--sombra-1);
           padding: 10px 14px; border-radius: var(--radio-chip); margin-bottom: 18px; font-size: 13px; }
  /* --- El selector de modelo --- */
  .modelos { display: grid; gap: 8px; margin-bottom: 6px; }
  .modelo { display: block; border: 2px solid var(--linea); border-radius: var(--radio-chip);
            padding: 10px 14px; cursor: pointer; background: var(--papel); }
  .modelo:hover { border-color: var(--marca); }
  .modelo--puesto { border-color: var(--marca); background: var(--lavanda-tinte); }
  .modelo input { margin-right: 8px; accent-color: var(--lavanda); }
  .modelo .chico { margin-left: 22px; }
  /* El botón del juego, con su canto; aquí también hay uno chico. */
  .boton--chico { min-height: 32px; padding: 0 12px; font-size: 13px; border-width: 2px; --canto: 3px; }
  /* --- Los medidores de tope --- */
  .tope { background: var(--papel); border-left: 5px solid var(--linea); box-shadow: var(--sombra-1);
          border-radius: var(--radio-chip); padding: 12px 16px; margin-bottom: 10px; }
  .tope--bien { border-left-color: var(--negociacion); }
  .tope--ojo  { border-left-color: var(--sol); }
  .tope--mal  { border-left-color: var(--mal); }
  .tope--nd   { border-left-color: var(--linea-fuerte); }
  .tope__cab { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .tope__cifra { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; }
  .barra { height: 8px; background: var(--crema-hondo); border-radius: 99px; overflow: hidden; margin-bottom: 7px; }
  .barra i { display: block; height: 100%; background: var(--negociacion); }
  .tope--ojo .barra i { background: var(--sol); }
  .tope--mal .barra i { background: var(--mal); }
  .tope__que { margin-top: 8px; font-size: 13px; }
  .tope__que summary { cursor: pointer; color: var(--lavanda-oscuro); font-weight: 800; font-size: 12px; }
  .tope__que ol { margin: 8px 0; padding-left: 20px; }
  .tope__que li { margin-bottom: 6px; }
  .tope__que code { background: var(--crema-hondo); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  .copiable { cursor: pointer; border-bottom: 1px dotted var(--linea-fuerte); }
  .copiable:hover { color: var(--lavanda-oscuro); border-bottom-color: var(--lavanda); }
  /* --- El detalle de una llamada: a pantalla casi completa --- */
  #detalle { position: fixed; inset: 0; background: rgba(46, 42, 63, .5);
             display: none; z-index: 50; }
  #detalle[data-abierto] { display: block; }
  #detalle .caja { position: absolute; inset: 3vh 4vw; background: var(--papel);
                   border-radius: var(--radio-modal); display: flex; flex-direction: column;
                   box-shadow: var(--sombra-3); overflow: hidden; }
  #detalle header { display: flex; align-items: center; gap: 14px;
                    padding: 14px 18px; border-bottom: 1px solid var(--linea); }
  #detalle header h3 { margin: 0; font-size: 1.1rem; }
  #detalle .pestanas { display: flex; gap: 6px; margin-left: auto; }
  #detalle .pestanas button { font: inherit; font-size: 12px; font-weight: 800;
    padding: 6px 14px; border: 0; background: var(--crema-hondo);
    border-radius: 999px; cursor: pointer; color: var(--suave); }
  #detalle .pestanas button[aria-current] { background: var(--lavanda); color: #fff; }
  #detalle .cuerpo { flex: 1; overflow: auto; margin: 0; padding: 16px 18px;
                     font: 12px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                     white-space: pre-wrap; word-break: break-word; border: 0; border-radius: 0; }
  #detalle .cerrar { font: inherit; border: 0; background: none; cursor: pointer;
                     color: var(--suave); font-size: 24px; line-height: 1; padding: 0 4px; }
  .j-clave { color: var(--lavanda-oscuro); } .j-texto { color: var(--negociacion-oscuro); }
  .j-num { color: var(--debate-oscuro); } .j-bool { color: var(--peligro); }
  /* --- La puerta, como la del juego --- */
  #puerta { max-width: 380px; margin: 10vh auto; background: var(--papel);
            border-radius: var(--radio-modal); box-shadow: var(--sombra-2); padding: 28px; text-align: center; }
  #puerta img { height: 56px; width: auto; margin: 0 auto 8px; }
  #puerta h1 { font-size: 1.35rem; margin: 0 0 4px; color: var(--lavanda-oscuro); }
  #puerta input { margin-top: 10px; text-align: left; }
  #puerta button { width: 100%; margin-top: 16px; }
  #puerta .error { color: var(--mal); font-size: 13px; margin-top: 10px; min-height: 18px; }
  #captcha { display: flex; justify-content: center; }
  pre { background: var(--crema); border-radius: var(--radio-chip);
        padding: 10px; font-size: 12px; white-space: pre-wrap; margin: 0; }
  /* --- LO INCRUSTADO (titular, 2026-09-23): el simulador de la app y las
     herramientas de laboratorio, dentro del tablero. El simulador va en un
     marco de teléfono porque es el juego, que es solo móvil; lo demás ocupa el
     lienzo entero. */
  /* --- TEMAS: el catálogo publicado, en tarjetas editables (2026-09-24) --- */
  .t-barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  .t-grupo { display: flex; gap: 6px; flex-wrap: wrap; }
  .t-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    border: 2px solid var(--linea, #e8e0d4); background: var(--papel); font-weight: 800; cursor: pointer; color: var(--tinta); }
  .t-chip[aria-pressed="true"] { background: var(--lavanda-tinte); border-color: var(--lavanda); color: var(--lavanda-oscuro); }
  .t-chip__n { font-size: 12px; opacity: .7; }
  .t-buscar { flex: 1 1 180px; max-width: 280px; }
  .t-nota { margin: 0 0 14px; }
  .t-lista { display: grid; gap: 12px; }
  .t-carta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; padding: 14px 16px;
    background: var(--papel); border-radius: 18px; box-shadow: var(--sombra-1); border: 2px solid transparent; }
  .t-carta--cambiada, .t-carta--nueva { border-color: var(--sol-oscuro, #d9a300); }
  .t-carta--guardando { opacity: .6; }
  .t-carta--borrando { border-color: var(--peligro, #d9534f); }
  .t-campos { display: grid; gap: 8px; min-width: 0; }
  .t-fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .t-fila:has(.t-campo--titulo) { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); }
  .t-campo { display: grid; gap: 3px; font-size: 12px; font-weight: 800; color: var(--suave); }
  .t-campo .campo { font-size: 14px; font-weight: 600; color: var(--tinta); padding: 8px 10px; }
  .t-campo textarea.campo { resize: vertical; line-height: 1.35; }
  .t-pie { margin: 0; }
  .t-acciones { display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: flex-start; width: 56px; }
  .t-carta--borrando .t-acciones { width: 150px; }
  .t-icono { width: 48px; height: 48px; border-radius: 14px; border: 0; background: var(--crema-hondo, #f3ede3);
    display: grid; place-items: center; cursor: pointer; transition: transform .12s, filter .12s, opacity .12s; }
  .t-icono:hover:not(:disabled) { transform: scale(1.08); }
  .t-icono:disabled { opacity: .35; filter: grayscale(1); cursor: default; }
  .t-carta--cambiada [data-t-guardar]:not(:disabled), .t-carta--nueva [data-t-guardar]:not(:disabled) {
    background: var(--lavanda-tinte); box-shadow: 0 0 0 2px var(--sol-oscuro, #d9a300); }
  .t-pregunta { font-size: 13px; font-weight: 700; margin: 0; text-align: center; }
  .t-si { --cara: var(--peligro, #d9534f); }
  @media (max-width: 760px) { .t-fila:has(.t-campo--titulo) { grid-template-columns: 1fr 1fr; } .t-campo--titulo { grid-column: 1 / -1; } }
  .incrustado { display: block; width: 100%; height: calc(100vh - var(--alto-cab)); border: 0; background: var(--crema); }
  /* El interruptor del emulador, encima de su panel (2026-09-24). */
  .emu-barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--linea, #e8e0d4); }
  .emu-estado { font-weight: 800; font-size: 14px; }
  .emu-estado--on::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3AA655; margin-right: 8px; }
  .incrustado--emu { height: calc(100vh - var(--alto-cab) - 52px); }
  .movil { display: grid; justify-items: center; gap: 12px; padding: 22px; }
  .movil iframe { width: 430px; height: min(860px, calc(100vh - var(--alto-cab) - 90px)); border: 10px solid #2E2A3F;
                  border-radius: 38px; box-shadow: var(--sombra-3); background: var(--crema); }
  .solo-aqui { max-width: 620px; margin: 40px auto; }
  /* --- «Gente»: el filtro de sin confirmar (2026-09-23) --- */
  .filtro-gente { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filtro-gente .chip-f { font: inherit; font-family: var(--display); font-weight: 800; font-size: 13px;
    border: 0; border-radius: 999px; padding: 5px 14px; cursor: pointer;
    background: var(--papel); color: var(--suave); box-shadow: var(--sombra-1); }
  .filtro-gente .chip-f[aria-pressed="true"] { background: var(--lavanda); color: #fff; }
  .filtro-gente .boton { margin: 0 0 0 auto; }
  .pastilla--ojo { background: var(--sol-tinte); color: #8A6A0B; }
  td input[type="checkbox"], th input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--lavanda); cursor: pointer; }
  /* --- LOS FONDOS: pantallas, láminas y la app en un teléfono (2026-09-23) --- */
  .f-armazon { display: grid; grid-template-columns: 250px minmax(0, 1fr) 460px;
               height: calc(100vh - var(--alto-cab)); }
  .f-lista { overflow-y: auto; padding: 16px 10px; border-right: 1px solid var(--linea); background: var(--papel); }
  /* LOS GRUPOS DE PANTALLAS SE PLIEGAN (titular, 2026-09-24), con la misma
     flecha que los del menú: abajo abierto, a la derecha plegado. */
  .f-grupo + .f-grupo { margin-top: 12px; }
  .f-lista button.grupo__t {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%;
    border: 0; background: none; cursor: pointer; text-align: left;
    padding: 4px 8px; border-radius: var(--radio-chip);
  }
  .f-lista button.grupo__t:hover { color: var(--tinta-suave); }
  .f-lista button.grupo__t small { font-size: 11px; letter-spacing: 0; text-transform: none; font-weight: 700; }
  .f-lista button.grupo__t::after {
    content: ''; width: 7px; height: 7px; flex: none; margin-right: 2px;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s;
  }
  .f-grupo[data-plegado] button.grupo__t::after { transform: rotate(-45deg); }
  .f-grupo[data-plegado] .f-esp:not(.f-esp--puesto):not(.f-esp--pendiente) { display: none; }
  .f-esp { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit;
           background: none; border: 0; border-radius: var(--radio-chip); padding: 6px 8px; cursor: pointer; color: var(--tinta); }
  .f-esp:hover { background: var(--crema-hondo); }
  .f-esp--puesto { background: var(--lavanda-tinte); }
  /* Pantalla con cambios sin guardar: un punto dorado al final de la fila. */
  .f-esp--hereda img { opacity: .45; }
  .f-esp--pendiente { position: relative; }
  .f-esp--pendiente::after { content: ''; position: absolute; right: 10px; top: 50%; width: 9px; height: 9px;
    margin-top: -4px; border-radius: 50%; background: #F5C243; box-shadow: 0 0 0 2px #fff; }
  .f-esp img { width: 34px; height: 48px; object-fit: cover; border-radius: 6px; box-shadow: var(--sombra-1); flex: none; }
  .f-esp span { font-family: var(--display); font-weight: 700; font-size: 14px; line-height: 1.2; }
  .f-esp small { display: block; font-family: var(--texto); font-weight: 600; font-size: 11px; color: var(--tenue); }
  /* LA COLUMNA DEL CENTRO NO SCROLLEA ENTERA (titular, 2026-09-23): arriba el
     título y el botón de subir, en medio las láminas --lo único que se desliza--
     y abajo, siempre a la vista, «Guardar» y «Volver al de fábrica». */
  .f-centro { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; overflow: hidden; }
  .f-cab { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 24px 10px; }
  .f-cab h2 { margin: 0; }
  .f-subir { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .f-subir label.chico { display: flex; align-items: center; gap: 6px; }
  /* El campo de número de la cabecera de fondos: del alto de un botón chico,
     no de los 48 de un `.campo` de formulario. */
  .f-subir .f-num { width: 64px; min-height: 0; height: 34px; padding: 4px 8px; border-radius: 10px;
                    font-size: 14px; font-weight: 700; text-align: right; }
  .f-subir__boton { margin-bottom: 3px; cursor: pointer; }
  .f-laminas { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px;
               align-content: start; overflow-y: auto; padding: 6px 24px 18px; }
  .f-sep { grid-column: 1 / -1; margin: 6px 0 -4px; }
  .f-lam-caja { position: relative; }
  .f-borrar { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%;
              border: 2px solid #fff; background: var(--peligro); color: #fff; font: 800 15px/1 var(--texto);
              cursor: pointer; box-shadow: var(--sombra-1); }
  /* «Sin fondo»: la casilla vacía, y la miniatura de una pantalla sin fondo. */
  .f-vacio { display: grid; place-items: center; width: 100%; aspect-ratio: 9 / 16; border-radius: 9px;
             border: 2px dashed var(--linea-fuerte); background: var(--crema); color: var(--tinta-tenue);
             font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .f-esp .f-vacio { width: 34px; height: 48px; aspect-ratio: auto; font-size: 0; flex: none; }
  .f-lam { width: 100%; font: inherit; background: var(--papel); border: 3px solid transparent; border-radius: var(--radio-chip);
           padding: 6px; cursor: pointer; box-shadow: var(--sombra-1); display: grid; gap: 6px; }
  .f-lam img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; object-position: center top; border-radius: 9px; }
