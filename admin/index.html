<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ATWI · tablero</title>
<!--
  EL TABLERO NO ES EL JUEGO. Vive en su propia carpeta, no carga ni un archivo
  del juego y no comparte sesión con él: entrar aquí con la cuenta de jugar no
  sirve de nada si esa cuenta no está en `admins`.

  ESTO NO ES ESCRITORIO-SOLO POR CASUALIDAD. El juego es un móvil de 430 px y
  aquí hay tablas de consumo con ocho columnas. Son dos productos distintos y se
  diseñan distinto; la regla de «solo móvil» de CLAUDE.md es para el juego.

  LA SEGURIDAD NO LA DA ESTA PÁGINA. La dan las políticas RLS: `es_admin()` en
  la base. Aunque alguien se descargue este HTML y lo abra, la base no le va a
  devolver una fila. Lo de aquí es comodidad, no una puerta.
-->
<style>
  :root {
    --tinta: #23202b; --suave: #6b6577; --tenue: #9b95a6;
    --fondo: #f6f4f1; --papel: #fff; --linea: #e7e3de;
    --marca: #7a6ad8; --bien: #2e9e7e; --mal: #d2564b; --ojo: #c98a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--tinta);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    background: var(--papel); border-bottom: 1px solid var(--linea);
    padding: 12px 20px; display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header .quien { margin-left: auto; color: var(--suave); font-size: 13px; }
  nav { display: flex; gap: 4px; padding: 0 20px; background: var(--papel);
        border-bottom: 1px solid var(--linea); position: sticky; top: 49px; z-index: 9; }
  nav button {
    font: inherit; font-weight: 600; background: none; border: 0; cursor: pointer;
    padding: 10px 14px; color: var(--suave); border-bottom: 2px solid transparent;
  }
  nav button[aria-current] { color: var(--marca); border-bottom-color: var(--marca); }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .tarjeta { background: var(--papel); border: 1px solid var(--linea); border-radius: 10px; padding: 14px 16px; }
  .tarjeta .eti { color: var(--tenue); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
  .tarjeta .dato { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tarjeta .pie { color: var(--suave); font-size: 12px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: var(--papel);
          border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  th { background: #fbfaf9; font-size: 11px; text-transform: uppercase;
       letter-spacing: .06em; color: var(--tenue); font-weight: 700; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  h2 { font-size: 14px; margin: 26px 0 10px; letter-spacing: .02em; }
  h2:first-child { margin-top: 0; }
  .chico { font-size: 12px; color: var(--suave); }
  .mal { color: var(--mal); } .bien { color: var(--bien); } .ojo { color: var(--ojo); }
  .pastilla { display: inline-block; padding: 1px 7px; border-radius: 99px;
              background: #efecf8; color: var(--marca); font-size: 11px; font-weight: 700; }
  .aviso { background: #fff7e6; border: 1px solid #f0dcae; color: #6b5316;
           padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 13px; }
  /* --- El selector de modelo --- */
  .modelos { display: grid; gap: 8px; margin-bottom: 6px; }
  .modelo { display: block; border: 1px solid var(--linea); border-radius: 8px;
            padding: 10px 14px; cursor: pointer; background: var(--papel); }
  .modelo:hover { border-color: var(--marca); }
  /* El puesto se ve sin tener que leer el radio: son tres renglones parecidos y
     a la pregunta «¿cuál está corriendo ahora?» hay que contestarla de un
     vistazo, que es la razón de que exista esta pestaña. */
  .modelo--puesto { border-color: var(--marca); background: #f7f5fd; }
  .modelo input { margin-right: 8px; }
  .modelo .chico { margin-left: 22px; }
  .boton { font: inherit; font-weight: 700; padding: 9px 20px; cursor: pointer;
           background: var(--marca); color: #fff; border: 0; border-radius: 8px; }
  .boton--chico { font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  /* --- Los medidores de tope --- */
  .tope { background: var(--papel); border: 1px solid var(--linea); border-left-width: 4px;
          border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
  .tope--bien { border-left-color: var(--bien); }
  .tope--ojo  { border-left-color: var(--ojo); }
  .tope--mal  { border-left-color: var(--mal); }
  .tope--nd   { border-left-color: var(--linea); }
  .tope__cab { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .tope__cifra { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; }
  .barra { height: 7px; background: #f0eeeb; border-radius: 99px; overflow: hidden; margin-bottom: 7px; }
  .barra i { display: block; height: 100%; background: var(--bien); }
  .tope--ojo .barra i { background: var(--ojo); }
  .tope--mal .barra i { background: var(--mal); }
  .tope__que { margin-top: 8px; font-size: 13px; }
  .tope__que summary { cursor: pointer; color: var(--marca); font-weight: 600; font-size: 12px; }
  .tope__que ol { margin: 8px 0; padding-left: 20px; }
  .tope__que li { margin-bottom: 6px; }
  .tope__que code { background: #f4f2ef; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  .copiable { cursor: pointer; border-bottom: 1px dotted var(--linea); }
  .copiable:hover { color: var(--marca); border-bottom-color: var(--marca); }
  /* --- El detalle de una llamada ---
     A pantalla casi completa y no en una ventanita: lo que se viene a mirar
     aquí es un JSON de cientos de líneas, y leerlo por una rendija es no
     leerlo. */
  #detalle { position: fixed; inset: 0; background: rgba(28,24,20,.55);
             display: none; z-index: 50; }
  #detalle[data-abierto] { display: block; }
  #detalle .caja { position: absolute; inset: 3vh 4vw; background: var(--papel);
                   border-radius: 12px; display: flex; flex-direction: column;
                   box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
  #detalle header { display: flex; align-items: center; gap: 14px;
                    padding: 14px 18px; border-bottom: 1px solid var(--linea); }
  #detalle header h3 { margin: 0; font-size: 14px; }
  #detalle .pestanas { display: flex; gap: 4px; margin-left: auto; }
  #detalle .pestanas button { font: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 14px; border: 1px solid var(--linea); background: #fbfaf9;
    border-radius: 7px; cursor: pointer; color: var(--suave); }
  #detalle .pestanas button[aria-current] { background: var(--marca); color: #fff;
                                            border-color: var(--marca); }
  #detalle .cuerpo { flex: 1; overflow: auto; margin: 0; padding: 16px 18px;
                     font: 12px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                     white-space: pre-wrap; word-break: break-word; }
  #detalle .cerrar { font: inherit; border: 0; background: none; cursor: pointer;
                     color: var(--suave); font-size: 20px; line-height: 1; padding: 0 4px; }
  /* El coloreado: sin librería, cuatro reglas. Un JSON de 300 líneas todo del
     mismo color se lee igual de mal en un tablero que en cualquier sitio. */
  .j-clave { color: #7a5cc4; } .j-texto { color: #2f6f4f; }
  .j-num { color: #b5651d; } .j-bool { color: #a33; }
  /* --- La puerta --- */
  #puerta { max-width: 340px; margin: 12vh auto; background: var(--papel);
            border: 1px solid var(--linea); border-radius: 12px; padding: 26px; }
  #puerta h1 { font-size: 17px; margin: 0 0 4px; }
  #puerta input {
    font: inherit; width: 100%; padding: 10px 12px; margin-top: 10px;
    border: 1px solid var(--linea); border-radius: 8px; background: #fbfaf9;
  }
  #puerta button {
    font: inherit; font-weight: 700; width: 100%; margin-top: 14px; padding: 11px;
    background: var(--marca); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  }
  #puerta .error { color: var(--mal); font-size: 13px; margin-top: 10px; min-height: 18px; }
  pre { background: #fbfaf9; border: 1px solid var(--linea); border-radius: 8px;
        padding: 10px; font-size: 12px; white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>

<div id="puerta">
  <h1>Tablero de ATWI</h1>
  <p class="chico">Cuenta de administración. No es la de jugar.</p>
  <input id="correo" type="email" autocomplete="username" placeholder="correo">
  <input id="clave" type="password" autocomplete="current-password" placeholder="contraseña">
  <!-- El antirrobots NO es opcional aquí. Supabase Auth tiene el captcha
       obligatorio y lo exige también en la entrada por contraseña, no solo en el
       alta: sin token devuelve `captcha_failed` y no deja pasar. Se comprobó
       pidiendo el token con una cuenta inventada. -->
  <div id="captcha" style="margin-top:12px"></div>
  <button id="entrar">Entrar</button>
  <p class="error" id="error"></p>
</div>

<div id="tablero" hidden>
  <header>
    <h1>ATWI · tablero</h1>
    <span class="quien" id="quien"></span>
    <button id="salir" style="font:inherit;background:none;border:0;color:var(--suave);cursor:pointer">Salir</button>
  </header>
  <nav>
    <button data-pest="costos" aria-current="page">Costos</button>
    <button data-pest="gente">Gente</button>
    <button data-pest="partidas">Partidas</button>
    <button data-pest="material">Material</button>
    <button data-pest="bitacora">Bitácora</button>
    <button data-pest="navegadores">Navegadores</button>
    <button data-pest="llamadas">Llamadas</button>
    <button data-pest="modelos">Modelos</button>
    <button data-pest="limites">Límites</button>
  </nav>
  <main id="lienzo"></main>

  <!-- El detalle de una llamada: lo que se mandó y lo que vino. -->
  <div id="detalle" role="dialog" aria-modal="true" aria-labelledby="d-titulo">
    <div class="caja">
      <header>
        <h3 id="d-titulo"></h3>
        <div class="pestanas">
          <button data-cara="peticion" aria-current="page">Lo que se mandó</button>
          <button data-cara="respuesta">Lo que vino</button>
        </div>
        <button class="cerrar" data-cerrar aria-label="Cerrar">×</button>
      </header>
      <pre class="cuerpo" id="d-cuerpo"></pre>
    </div>
  </div>
</div>

<script src="../assets/js/config.js?v=f626722"></script>
<script src="tablero.js?v=f626722"></script>
</body>
</html>
