<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aquí no hay nada · ATWI</title>
<!--
  Esta página va SIN hojas de estilo externas a propósito. GitHub Pages la sirve
  para cualquier ruta que no exista, incluidas rutas con varios niveles, así que
  una ruta relativa apuntaría a un sitio distinto cada vez y una ruta absoluta se
  rompe cuando el sitio cuelga de una subcarpeta como /atwi/. Con los estilos
  dentro no hay nada que se pueda romper.
-->
<style>
  :root { --crema:#FBF7F2; --tinta:#2E2A3F; --tinta-suave:#6D6683; --lavanda:#7A6AD8; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100dvh; display:grid; place-items:center; padding:2rem;
    text-align:center; background:var(--crema); color:var(--tinta);
    font-family: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
  }
  h1 { font-size:1.75rem; margin:0 0 .5rem; letter-spacing:-.01em; }
  p { margin:0 0 1.5rem; color:var(--tinta-suave); }
  .emoji { font-size:4rem; margin-bottom:1rem; }
  a.boton {
    display:inline-flex; align-items:center; justify-content:center;
    min-height:48px; padding:0 1.5rem; border-radius:999px;
    background:var(--lavanda); color:#fff; font-weight:800; font-size:1.0625rem;
    text-decoration:none; box-shadow:0 8px 20px rgba(122,106,216,.34);
  }
</style>
</head>
<body>
  <div>
    <div class="emoji">🤔</div>
    <h1>Aquí no hay nada</h1>
    <p>Esta página no existe, y sobre eso no hay debate.</p>
    <a class="boton" id="inicio" href="/">Volver al inicio</a>
  </div>
<script>
  /* El inicio está en la raíz si hay dominio propio, y en /<repo>/ si el sitio
     cuelga de una subcarpeta de github.io. Se calcula en vez de suponerlo. */
  (function () {
    var a = document.getElementById('inicio');
    if (location.hostname.endsWith('github.io')) {
      var repo = location.pathname.split('/')[1];
      if (repo) a.href = '/' + repo + '/';
    }
  })();
</script>
</body>
</html>
